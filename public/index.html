<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustLens | Premium Cyber Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dynamic Background -->
  <div class="glow-bg glow-1"></div>
  <div class="glow-bg glow-2"></div>

  <div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div class="sidebar glass-panel" id="sidebar-wrapper">
      <div class="sidebar-heading text-cyan">
        <i class="fa-solid fa-shield-halved me-2"></i> TrustLens
      </div>
      <div class="list-group list-group-flush mt-3" id="sidebarLinks">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="w-100">
      <!-- Topbar -->
      <nav class="navbar navbar-expand-lg glass-panel topbar mb-4 px-4">
        <div class="container-fluid">
          <button class="btn btn-outline-cyan btn-sm" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
          <div class="d-flex align-items-center gap-3 ms-auto" id="topbarRight">
            <!-- Injected via JS -->
          </div>
        </div>
      </nav>

      <!-- Main App Area -->
      <div class="container-fluid px-4 pb-5">
        <div id="app"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
